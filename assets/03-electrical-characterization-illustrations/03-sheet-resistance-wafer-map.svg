<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual sheet-resistance wafer-map patterns</title>
  <desc id="desc">Three simulated wafer maps show uniform, center-high, and edge-high spatial distributions, followed by a path from pattern to hypothesis and additional evidence.</desc>
  <rect width="1400" height="760" fill="#ffffff"/>
  <style>
    .heading { font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .small { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536174; }
    .flow { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
  </style>

  <text x="700" y="54" text-anchor="middle" class="heading">Simulated Sheet-Resistance Distributions</text>

  <defs>
    <clipPath id="wafer-a"><circle cx="250" cy="275" r="150"/></clipPath>
    <clipPath id="wafer-b"><circle cx="700" cy="275" r="150"/></clipPath>
    <clipPath id="wafer-c"><circle cx="1150" cy="275" r="150"/></clipPath>
    <radialGradient id="center-high" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#ef8354"/>
      <stop offset="48%" stop-color="#f6b26b"/>
      <stop offset="100%" stop-color="#dcebf4"/>
    </radialGradient>
    <radialGradient id="edge-high" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#dcebf4"/>
      <stop offset="58%" stop-color="#b9d8e8"/>
      <stop offset="82%" stop-color="#f6b26b"/>
      <stop offset="100%" stop-color="#ef8354"/>
    </radialGradient>
  </defs>

  <text x="250" y="105" text-anchor="middle" class="label">Uniform</text>
  <circle cx="250" cy="275" r="150" fill="#b9d8e8" stroke="#172033" stroke-width="3"/>
  <g clip-path="url(#wafer-a)" fill="#8bbbd1">
    <circle cx="190" cy="215" r="8"/><circle cx="265" cy="205" r="8"/><circle cx="320" cy="255" r="8"/>
    <circle cx="205" cy="300" r="8"/><circle cx="275" cy="285" r="8"/><circle cx="315" cy="345" r="8"/>
    <circle cx="225" cy="365" r="8"/>
  </g>
  <path d="M230 126 h40 l-9 16 h-22 z" fill="#ffffff" stroke="#172033" stroke-width="3"/>
  <text x="250" y="460" text-anchor="middle" class="small">No strong spatial trend</text>

  <text x="700" y="105" text-anchor="middle" class="label">Center-high</text>
  <circle cx="700" cy="275" r="150" fill="url(#center-high)" stroke="#172033" stroke-width="3"/>
  <circle cx="700" cy="275" r="54" fill="none" stroke="#c94f2d" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M680 126 h40 l-9 16 h-22 z" fill="#ffffff" stroke="#172033" stroke-width="3"/>
  <text x="700" y="460" text-anchor="middle" class="small">Higher values near the center</text>

  <text x="1150" y="105" text-anchor="middle" class="label">Edge-high</text>
  <circle cx="1150" cy="275" r="150" fill="url(#edge-high)" stroke="#172033" stroke-width="3"/>
  <circle cx="1150" cy="275" r="122" fill="none" stroke="#c94f2d" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M1130 126 h40 l-9 16 h-22 z" fill="#ffffff" stroke="#172033" stroke-width="3"/>
  <text x="1150" y="460" text-anchor="middle" class="small">Higher values near the edge</text>

  <rect x="125" y="545" width="280" height="86" rx="14" fill="#f4f7fa" stroke="#172033" stroke-width="2"/>
  <text x="265" y="580" text-anchor="middle" class="flow">Spatial pattern</text>
  <text x="265" y="608" text-anchor="middle" class="small">What looks different?</text>

  <path d="M425 588 H535" fill="none" stroke="#487da1" stroke-width="4"/>
  <path d="M535 588 l-16 -10 v20 z" fill="#487da1"/>

  <rect x="555" y="545" width="290" height="86" rx="14" fill="#fff7ed" stroke="#c7663d" stroke-width="2"/>
  <text x="700" y="580" text-anchor="middle" class="flow">Engineering hypothesis</text>
  <text x="700" y="608" text-anchor="middle" class="small">What could be related?</text>

  <path d="M865 588 H975" fill="none" stroke="#487da1" stroke-width="4"/>
  <path d="M975 588 l-16 -10 v20 z" fill="#487da1"/>

  <rect x="995" y="545" width="280" height="86" rx="14" fill="#f4f7fa" stroke="#172033" stroke-width="2"/>
  <text x="1135" y="580" text-anchor="middle" class="flow">Additional evidence</text>
  <text x="1135" y="608" text-anchor="middle" class="small">Thickness, material, setup</text>

  <text x="700" y="700" text-anchor="middle" class="small">Pattern ≠ cause · simulated values · conceptual schematic</text>
</svg>
