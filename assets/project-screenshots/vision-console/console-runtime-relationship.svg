<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52616f"/>
    </marker>
    <style>
      .title { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252b; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252b; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4c555f; }
      .box { fill: #f8fafb; stroke: #9aa6b2; stroke-width: 2; rx: 18; }
      .config { fill: #fff4df; stroke: #ca9a46; stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <text x="40" y="42" class="title">From imaging setup to traceable inspection</text>

  <rect x="40" y="85" width="300" height="170" class="box"/>
  <text x="190" y="125" text-anchor="middle" class="label">Vision Console</text>
  <text x="190" y="160" text-anchor="middle" class="small">camera streams and imaging controls</text>
  <text x="190" y="187" text-anchor="middle" class="small">ROI setup and lightweight CV preview</text>
  <text x="190" y="214" text-anchor="middle" class="small">snapshot and preset review</text>

  <rect x="410" y="115" width="260" height="110" class="config"/>
  <text x="540" y="158" text-anchor="middle" class="label">Configuration / Recipe</text>
  <text x="540" y="192" text-anchor="middle" class="small">confirmed acquisition settings</text>

  <rect x="740" y="85" width="340" height="170" class="box"/>
  <text x="910" y="125" text-anchor="middle" class="label">Wafer Inspection Runtime</text>
  <text x="910" y="160" text-anchor="middle" class="small">acquisition and inspection execution</text>
  <text x="910" y="187" text-anchor="middle" class="small">session, trigger, status, and history</text>
  <text x="910" y="214" text-anchor="middle" class="small">result aggregation and review</text>

  <path d="M340 170 H410" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M670 170 H740" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="40" y="300" class="small">The console establishes how the image is produced; the runtime uses those settings to execute and preserve the inspection context.</text>
</svg>
