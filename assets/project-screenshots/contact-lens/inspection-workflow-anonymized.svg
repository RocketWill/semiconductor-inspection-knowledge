<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#377bb5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b963e"/>
    </marker>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252b; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252b; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4c555f; }
      .box { fill: #fafafa; stroke: #aeb6bf; stroke-width: 2; rx: 16; }
      .ai { fill: #e7f1fa; stroke: #6d9bc3; stroke-width: 2; rx: 14; }
      .rule { fill: #edf5e8; stroke: #79a45f; stroke-width: 2; rx: 14; }
      .fusion { fill: #fff1e5; stroke: #d19a6f; stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <text x="40" y="42" class="title">Anonymized multi-path inspection workflow</text>

  <rect x="40" y="80" width="240" height="110" class="box"/>
  <text x="160" y="113" text-anchor="middle" class="label">Path A</text>
  <text x="160" y="142" text-anchor="middle" class="small">multi-focus imaging</text>
  <text x="160" y="166" text-anchor="middle" class="small">center and edge coverage</text>

  <rect x="40" y="225" width="240" height="90" class="box"/>
  <text x="160" y="260" text-anchor="middle" class="label">Path B</text>
  <text x="160" y="287" text-anchor="middle" class="small">intermediate region</text>

  <rect x="40" y="350" width="240" height="90" class="box"/>
  <text x="160" y="385" text-anchor="middle" class="label">Path C</text>
  <text x="160" y="412" text-anchor="middle" class="small">center region</text>

  <rect x="370" y="72" width="250" height="260" class="ai"/>
  <text x="495" y="108" text-anchor="middle" class="label">AI processing</text>
  <rect x="405" y="132" width="180" height="56" class="box"/>
  <text x="495" y="166" text-anchor="middle" class="small">Segmentation model A</text>
  <rect x="405" y="208" width="180" height="56" class="box"/>
  <text x="495" y="242" text-anchor="middle" class="small">Segmentation model B</text>
  <text x="495" y="298" text-anchor="middle" class="small">edge-strip classifier</text>

  <rect x="370" y="365" width="250" height="105" class="rule"/>
  <text x="495" y="405" text-anchor="middle" class="label">Rule-based checks</text>
  <text x="495" y="435" text-anchor="middle" class="small">stable geometric conditions</text>

  <rect x="730" y="155" width="250" height="165" class="fusion"/>
  <text x="855" y="195" text-anchor="middle" class="label">Result fusion</text>
  <text x="855" y="227" text-anchor="middle" class="small">cross-focus deduplication</text>
  <text x="855" y="252" text-anchor="middle" class="small">rule merging and severity</text>
  <text x="855" y="277" text-anchor="middle" class="small">similar to spatial NMS</text>

  <rect x="1020" y="195" width="125" height="85" class="box"/>
  <text x="1082" y="228" text-anchor="middle" class="label">Inspection</text>
  <text x="1082" y="254" text-anchor="middle" class="small">record</text>

  <path d="M280 135 H370" stroke="#377bb5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M280 270 H340 V220 H370" fill="none" stroke="#377bb5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M280 395 H370" stroke="#5b963e" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M620 200 H730" stroke="#377bb5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M620 417 H680 V290 H730" fill="none" stroke="#5b963e" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M980 237 H1020" stroke="#5a626b" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="40" y="520" class="small">Lighting arrangements, internal defect codes, model names, and decision thresholds are intentionally omitted.</text>
</svg>
