<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #667085; }
      .head { font-size: 18px; font-weight: 700; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
      .body { font-size: 15px; fill: #344054; }
      .muted { font-size: 14px; fill: #667085; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="60" y="58" class="title">One Anomaly, Four Evidence Layers</text>
  <text x="60" y="86" class="subtitle">Each layer answers a different question. None can substitute for the others.</text>

  <g transform="translate(60 128)">
    <rect width="1080" height="104" rx="8" fill="#f2f7fc" stroke="#bdd4ea"/>
    <rect width="7" height="104" rx="3" fill="#3979a8"/>
    <text x="30" y="30" class="kicker" fill="#3979a8">OPTICAL</text>
    <text x="30" y="61" class="head">What is visible, and where?</text>
    <text x="470" y="42" class="body">Position · morphology · size · contrast · distribution</text>
    <text x="470" y="72" class="muted">Does not establish carrier concentration, defect energy levels, or a leakage mechanism.</text>
  </g>

  <g transform="translate(60 246)">
    <rect width="1080" height="104" rx="8" fill="#fff5ef" stroke="#edc9b4"/>
    <rect width="7" height="104" rx="3" fill="#c86735"/>
    <text x="30" y="30" class="kicker" fill="#c86735">ELECTRICAL</text>
    <text x="30" y="61" class="head">How does the device respond?</text>
    <text x="470" y="42" class="body">Resistance · leakage · lifetime · I–V · C–V</text>
    <text x="470" y="72" class="muted">Does not by itself identify visible morphology or its physical origin.</text>
  </g>

  <g transform="translate(60 364)">
    <rect width="1080" height="104" rx="8" fill="#fff9e8" stroke="#ead897"/>
    <rect width="7" height="104" rx="3" fill="#b58a21"/>
    <text x="30" y="30" class="kicker" fill="#9a741b">PROCESS</text>
    <text x="30" y="61" class="head">What happened before measurement?</text>
    <text x="470" y="42" class="body">Lot · equipment · recipe · temperature · time · process step</text>
    <text x="470" y="72" class="muted">Does not prove that a specific material change or electrical mechanism occurred.</text>
  </g>

  <g transform="translate(60 482)">
    <rect width="1080" height="104" rx="8" fill="#f2f8f3" stroke="#bfd8c4"/>
    <rect width="7" height="104" rx="3" fill="#4d8a60"/>
    <text x="30" y="30" class="kicker" fill="#4d8a60">MATERIAL</text>
    <text x="30" y="61" class="head">What changed in the material?</text>
    <text x="470" y="42" class="body">Composition · phase · stress · interface · microstructure</text>
    <text x="470" y="72" class="muted">Does not reconstruct the complete process history or causal sequence on its own.</text>
  </g>

  <line x1="60" y1="626" x2="1140" y2="626" stroke="#182230" stroke-width="1.5"/>
  <text x="600" y="653" text-anchor="middle" class="body">Connect the records. Keep the evidence boundaries.</text>
</svg>
