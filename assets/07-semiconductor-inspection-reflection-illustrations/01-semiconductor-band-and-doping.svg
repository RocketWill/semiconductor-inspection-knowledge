<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; letter-spacing: -0.4px; }
      .subtitle { font-size: 15px; fill: #687386; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .note { font-size: 14px; fill: #667085; }
      .band { stroke: #172033; stroke-width: 4; stroke-linecap: round; }
      .fermi { stroke: #2563eb; stroke-width: 3; stroke-dasharray: 10 8; }
      .dopant { stroke: #d97706; stroke-width: 3; stroke-dasharray: 6 6; }
      .guide { stroke: #d8dee9; stroke-width: 1.5; }
    </style>
    <marker id="up" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#dc4c4c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#fbfcfe"/>
  <text x="64" y="58" class="title">Energy Bands in Intrinsic and Doped Semiconductors</text>
  <text x="64" y="86" class="subtitle">Conceptual energy diagram · energy spacing not to scale</text>

  <line x1="64" y1="118" x2="1136" y2="118" class="guide"/>

  <g transform="translate(64 146)">
    <rect width="326" height="420" rx="10" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
    <text x="24" y="42" class="panel-title">Intrinsic</text>
    <text x="24" y="68" class="note">Electron–hole pairs from thermal excitation</text>
    <line x1="46" y1="130" x2="280" y2="130" class="band"/>
    <line x1="46" y1="320" x2="280" y2="320" class="band"/>
    <line x1="46" y1="225" x2="280" y2="225" class="fermi"/>
    <text x="16" y="136" class="label">E<tspan baseline-shift="sub" font-size="11">C</tspan></text>
    <text x="16" y="326" class="label">E<tspan baseline-shift="sub" font-size="11">V</tspan></text>
    <text x="222" y="214" class="note">E<tspan baseline-shift="sub" font-size="10">F</tspan> near midgap</text>
    <path d="M116 304 C116 260 116 195 116 145" fill="none" stroke="#dc4c4c" stroke-width="3" marker-end="url(#up)"/>
    <circle cx="116" cy="122" r="8" fill="#2563eb"/>
    <circle cx="116" cy="320" r="9" fill="#fff" stroke="#dc4c4c" stroke-width="3"/>
    <text x="163" y="378" text-anchor="middle" class="note">equal electron and hole concentrations</text>
  </g>

  <g transform="translate(437 146)">
    <rect width="326" height="420" rx="10" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
    <text x="24" y="42" class="panel-title">n-type</text>
    <text x="24" y="68" class="note">Donor level supplies majority electrons</text>
    <line x1="46" y1="130" x2="280" y2="130" class="band"/>
    <line x1="46" y1="320" x2="280" y2="320" class="band"/>
    <line x1="46" y1="175" x2="280" y2="175" class="dopant"/>
    <line x1="46" y1="202" x2="280" y2="202" class="fermi"/>
    <text x="16" y="136" class="label">E<tspan baseline-shift="sub" font-size="11">C</tspan></text>
    <text x="16" y="326" class="label">E<tspan baseline-shift="sub" font-size="11">V</tspan></text>
    <text x="194" y="165" class="note">donor level</text>
    <text x="205" y="224" class="note">E<tspan baseline-shift="sub" font-size="10">F</tspan> shifts upward</text>
    <path d="M116 168 C116 155 116 144 116 138" fill="none" stroke="#dc4c4c" stroke-width="3" marker-end="url(#up)"/>
    <circle cx="116" cy="122" r="8" fill="#2563eb"/>
    <text x="163" y="378" text-anchor="middle" class="note">electrons are the majority carriers</text>
  </g>

  <g transform="translate(810 146)">
    <rect width="326" height="420" rx="10" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
    <text x="24" y="42" class="panel-title">p-type</text>
    <text x="24" y="68" class="note">Acceptor level supports majority holes</text>
    <line x1="46" y1="130" x2="280" y2="130" class="band"/>
    <line x1="46" y1="320" x2="280" y2="320" class="band"/>
    <line x1="46" y1="275" x2="280" y2="275" class="dopant"/>
    <line x1="46" y1="248" x2="280" y2="248" class="fermi"/>
    <text x="16" y="136" class="label">E<tspan baseline-shift="sub" font-size="11">C</tspan></text>
    <text x="16" y="326" class="label">E<tspan baseline-shift="sub" font-size="11">V</tspan></text>
    <text x="187" y="297" class="note">acceptor level</text>
    <text x="208" y="237" class="note">E<tspan baseline-shift="sub" font-size="10">F</tspan> shifts downward</text>
    <path d="M116 312 C116 299 116 287 116 281" fill="none" stroke="#dc4c4c" stroke-width="3" marker-end="url(#up)"/>
    <circle cx="116" cy="320" r="9" fill="#fff" stroke="#dc4c4c" stroke-width="3"/>
    <text x="163" y="378" text-anchor="middle" class="note">holes are the majority carriers</text>
  </g>

  <g transform="translate(66 612)">
    <circle cx="8" cy="0" r="7" fill="#2563eb"/><text x="23" y="5" class="note">electron</text>
    <circle cx="122" cy="0" r="8" fill="#fff" stroke="#dc4c4c" stroke-width="3"/><text x="138" y="5" class="note">hole</text>
    <line x1="225" y1="0" x2="275" y2="0" class="fermi"/><text x="287" y="5" class="note">Fermi level</text>
    <line x1="410" y1="0" x2="460" y2="0" class="dopant"/><text x="472" y="5" class="note">dopant level</text>
  </g>
</svg>
