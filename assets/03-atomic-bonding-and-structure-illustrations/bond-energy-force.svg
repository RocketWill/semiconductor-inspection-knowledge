<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Interatomic potential energy and force</title>
  <desc id="desc">Conceptual curves showing equilibrium spacing at the minimum potential energy and at zero net interatomic force.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202124"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>

  <style>
    text {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      fill: #202124;
    }
    .panel-title { font-size: 25px; font-weight: 650; }
    .axis-label { font-size: 19px; font-weight: 600; }
    .label { font-size: 18px; }
    .small { font-size: 16px; fill: #4f5660; }
    .note { font-size: 18px; fill: #30343a; }
    .axis { stroke: #202124; stroke-width: 2.2; marker-end: url(#arrow); }
    .zero { stroke: #aeb4bc; stroke-width: 1.4; stroke-dasharray: 6 6; }
    .guide { stroke: #6c737d; stroke-width: 1.4; stroke-dasharray: 6 6; }
    .curve { fill: none; stroke: #1769aa; stroke-width: 5; stroke-linecap: round; }
    .point { fill: #e4572e; }
  </style>

  <text x="300" y="48" text-anchor="middle" class="panel-title">Potential energy, U(r)</text>
  <line x1="72" y1="460" x2="548" y2="460" class="axis"/>
  <line x1="82" y1="485" x2="82" y2="82" class="axis"/>
  <line x1="82" y1="178" x2="535" y2="178" class="zero"/>
  <text x="94" y="168" class="small">U = 0</text>

  <path d="M128 92 C164 154 194 262 236 337 C270 398 310 420 349 410 C405 395 460 330 526 232" class="curve"/>
  <line x1="337" y1="460" x2="337" y2="412" class="guide"/>
  <circle cx="337" cy="412" r="7" class="point"/>

  <text x="142" y="124" class="label">Short-range repulsion</text>
  <text x="387" y="268" class="label">Attractive tail</text>
  <text x="392" y="294" class="small">U(r) approaches 0</text>
  <text x="337" y="492" text-anchor="middle" class="label">Equilibrium spacing, r₀</text>
  <text x="514" y="444" text-anchor="end" class="axis-label">r</text>
  <text x="58" y="104" text-anchor="middle" class="axis-label">U</text>

  <text x="900" y="48" text-anchor="middle" class="panel-title">Interatomic force, F(r) = −dU/dr</text>
  <line x1="652" y1="460" x2="1128" y2="460" class="axis"/>
  <line x1="662" y1="485" x2="662" y2="82" class="axis"/>
  <line x1="662" y1="270" x2="1115" y2="270" class="zero"/>

  <path d="M708 104 C752 166 798 237 845 270 C894 305 939 351 985 342 C1033 333 1073 298 1112 280" class="curve"/>
  <line x1="845" y1="460" x2="845" y2="270" class="guide"/>
  <circle cx="845" cy="270" r="7" class="point"/>

  <text x="700" y="120" class="label">Repulsive force, F &gt; 0</text>
  <text x="925" y="376" class="label">Attractive force, F &lt; 0</text>
  <text x="845" y="492" text-anchor="middle" class="label">r₀</text>
  <text x="1094" y="444" text-anchor="end" class="axis-label">r</text>
  <text x="638" y="104" text-anchor="middle" class="axis-label">F</text>

  <line x1="92" y1="535" x2="1108" y2="535" stroke="#d7dbe0" stroke-width="1.5"/>
  <text x="600" y="568" text-anchor="middle" class="note">At r₀, potential energy is minimum and the net force is zero.</text>
  <text x="600" y="595" text-anchor="middle" class="small">A steeper curve near equilibrium generally corresponds to greater elastic stiffness. Conceptual; not to scale.</text>
</svg>
