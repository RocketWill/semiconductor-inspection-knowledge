<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Three parameter distributions within the same specification window</title>
  <desc id="desc">The first distribution is stable around target, the second shifts toward the high specification limit while mostly passing, and the third extends beyond the high specification limit.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <style>
    .axis { stroke:#111827; stroke-width:2.5; fill:none; stroke-linecap:round; }
    .limit { stroke:#dc2626; stroke-width:3; stroke-dasharray:10 8; }
    .target { stroke:#2563eb; stroke-width:3; stroke-dasharray:5 7; }
    .curve1 { stroke:#111827; stroke-width:5; fill:none; stroke-linecap:round; }
    .curve2 { stroke:#f59e0b; stroke-width:5; fill:none; stroke-linecap:round; }
    .curve3 { stroke:#dc2626; stroke-width:5; fill:none; stroke-linecap:round; }
    .fill3 { fill:#fee2e2; opacity:0.9; }
    .label { font:600 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#111827; }
    .small { font:500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#475569; }
    .redtext { font:600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#dc2626; }
    .bluetext { font:600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#2563eb; }
  </style>

  <text class="label" x="600" y="48" text-anchor="middle">Same specification window, different process states</text>

  <g transform="translate(55,90)">
    <g transform="translate(0,0)">
      <text class="label" x="165" y="24" text-anchor="middle">Stable</text>
      <path class="axis" d="M20 235h310"/>
      <path class="limit" d="M75 48v187M285 48v187"/>
      <path class="target" d="M180 48v187"/>
      <path class="curve1" d="M78 231C110 228 125 207 143 155C154 122 165 84 180 73C195 84 206 122 217 155C235 207 250 228 282 231"/>
      <text class="redtext" x="75" y="260" text-anchor="middle">Spec low</text>
      <text class="bluetext" x="180" y="282" text-anchor="middle">Target</text>
      <text class="redtext" x="285" y="260" text-anchor="middle">Spec high</text>
      <text class="small" x="180" y="319" text-anchor="middle">Centered and narrow</text>
    </g>

    <g transform="translate(380,0)">
      <text class="label" x="165" y="24" text-anchor="middle">Shifted, mostly passing</text>
      <path class="axis" d="M20 235h310"/>
      <path class="limit" d="M75 48v187M285 48v187"/>
      <path class="target" d="M180 48v187"/>
      <path class="curve2" d="M115 231C145 229 165 215 187 177C208 141 226 102 244 86C260 100 271 137 278 174C284 205 288 224 300 231"/>
      <text class="redtext" x="75" y="260" text-anchor="middle">Spec low</text>
      <text class="bluetext" x="180" y="282" text-anchor="middle">Target</text>
      <text class="redtext" x="285" y="260" text-anchor="middle">Spec high</text>
      <text class="small" x="180" y="319" text-anchor="middle">Drift appears before widespread failure</text>
    </g>

    <g transform="translate(760,0)">
      <text class="label" x="165" y="24" text-anchor="middle">Partially out of spec</text>
      <path class="axis" d="M20 235h310"/>
      <path class="limit" d="M75 48v187M285 48v187"/>
      <path class="target" d="M180 48v187"/>
      <path class="fill3" d="M285 235v-85C301 172 316 214 330 231v4z"/>
      <path class="curve3" d="M135 231C166 228 186 211 207 168C226 129 244 94 262 86C280 95 293 128 304 164C315 203 320 225 330 231"/>
      <text class="redtext" x="75" y="260" text-anchor="middle">Spec low</text>
      <text class="bluetext" x="180" y="282" text-anchor="middle">Target</text>
      <text class="redtext" x="285" y="260" text-anchor="middle">Spec high</text>
      <text class="small" x="180" y="319" text-anchor="middle">The high-side tail now fails</text>
    </g>
  </g>

  <g transform="translate(105,495)">
    <path class="curve1" d="M0 0h54"/>
    <text class="small" x="68" y="7">Reference distribution</text>
    <path class="curve2" d="M330 0h54"/>
    <text class="small" x="398" y="7">Shift toward spec high</text>
    <path class="curve3" d="M680 0h54"/>
    <text class="small" x="748" y="7">Tail beyond the limit</text>
  </g>

  <rect x="170" y="560" width="860" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="small" x="600" y="586" text-anchor="middle">A passing point answers whether that point crossed a specification limit.</text>
  <text class="small" x="600" y="611" text-anchor="middle">Process drift also needs the distribution center, width, spatial pattern, and history.</text>
</svg>
