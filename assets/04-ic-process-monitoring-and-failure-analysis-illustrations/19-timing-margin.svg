<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Output transition and timing margin</title>
  <desc id="desc">An input switches first, an output rises after a delay, and sampling points before and after the stable region show risky and safer timing.</desc>
  <defs><style>.bg{fill:#fbfaf7}.ink{fill:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:16px;fill:#475569}.axis{stroke:#334155;stroke-width:2}.input{stroke:#52796f;stroke-width:5;fill:none}.output{stroke:#277da1;stroke-width:5;fill:none}.risk{fill:#f6d2c8}.safe{fill:#dcece7}.dash{stroke:#334155;stroke-width:2;stroke-dasharray:8 7}</style></defs>
  <rect class="bg" width="1200" height="675"/><text class="ink h" x="600" y="60" text-anchor="middle">Sampling time is part of the test condition</text>
  <rect class="risk" x="525" y="110" width="180" height="420" opacity=".75"/><rect class="safe" x="705" y="110" width="350" height="420" opacity=".8"/>
  <text class="ink s" x="615" y="140" text-anchor="middle">transition region</text><text class="ink s" x="880" y="140" text-anchor="middle">stable region</text>
  <line class="axis" x1="130" y1="270" x2="1080" y2="270"/><line class="axis" x1="130" y1="470" x2="1080" y2="470"/>
  <text class="ink t" x="70" y="215">Input</text><text class="ink t" x="55" y="415">Output</text>
  <path class="input" d="M150 245 L360 245 L360 170 L1060 170"/>
  <path class="output" d="M150 445 L455 445 C520 445 575 420 620 370 C660 325 690 295 750 295 L1060 295"/>
  <line class="dash" x1="360" y1="110" x2="360" y2="530"/><text class="ink s" x="360" y="560" text-anchor="middle">input changes</text>
  <line class="dash" x1="600" y1="110" x2="600" y2="530"/><text class="ink s" x="600" y="590" text-anchor="middle">early sample</text>
  <line class="dash" x1="855" y1="110" x2="855" y2="530"/><text class="ink s" x="855" y="560" text-anchor="middle">later sample</text>
  <text class="ink s" x="600" y="640" text-anchor="middle">Conceptual waveform · Delay, voltage levels, and sampling points are not measured values</text>
</svg>
