<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CP test signal chain</title>
  <desc id="desc">A conceptual signal path from the tester through a probe card and probe needle to a product die, followed by a measured response.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><style>.bg{fill:#fbfaf7}.ink{fill:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:28px;font-weight:700}.t{font-size:20px;font-weight:650}.s{font-size:16px;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.accent{fill:#dcece7;stroke:#52796f;stroke-width:2}.warm{fill:#fff0cf;stroke:#b76822;stroke-width:2}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="675"/><text class="ink h" x="600" y="64" text-anchor="middle">The DUT is measured through an interface</text>
  <rect class="accent" x="60" y="185" width="180" height="115" rx="14"/><text class="ink t" x="150" y="230" text-anchor="middle">Tester</text><text class="ink s" x="150" y="263" text-anchor="middle">test condition</text>
  <rect class="box" x="285" y="185" width="200" height="115" rx="14"/><text class="ink t" x="385" y="225" text-anchor="middle">Performance board</text><text class="ink s" x="385" y="258" text-anchor="middle">and probe card</text>
  <rect class="warm" x="530" y="185" width="180" height="115" rx="14"/><text class="ink t" x="620" y="225" text-anchor="middle">Probe needle</text><text class="ink s" x="620" y="258" text-anchor="middle">mechanical contact</text>
  <rect class="warm" x="755" y="185" width="150" height="115" rx="14"/><text class="ink t" x="830" y="225" text-anchor="middle">Bond pad</text><text class="ink s" x="830" y="258" text-anchor="middle">contact mark</text>
  <rect class="accent" x="950" y="185" width="190" height="115" rx="14"/><text class="ink t" x="1045" y="225" text-anchor="middle">Product die</text><text class="ink s" x="1045" y="258" text-anchor="middle">DUT response</text>
  <path class="line" d="M240 242 L285 242"/><path class="line" d="M485 242 L530 242"/><path class="line" d="M710 242 L755 242"/><path class="line" d="M905 242 L950 242"/>
  <path class="line" d="M1045 300 C1045 410 150 410 150 300"/><text class="ink t" x="600" y="435" text-anchor="middle">Measured response returns through the same interface</text>
  <rect class="box" x="300" y="490" width="600" height="82" rx="12"/><text class="ink t" x="600" y="525" text-anchor="middle">Before assigning a die failure</text><text class="ink s" x="600" y="553" text-anchor="middle">check contact stability, test setup, and repeatability</text>
  <text class="ink s" x="600" y="635" text-anchor="middle">Conceptual path · No tester, pad, or probe-card design is reproduced</text>
</svg>
