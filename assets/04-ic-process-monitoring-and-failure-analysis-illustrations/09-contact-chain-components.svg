<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Contributions inside a contact-chain resistance measurement</title>
  <desc id="desc">A measured contact chain includes lead, semiconductor layer, multiple contacts, and metal resistance rather than only contact resistance.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <style>
    .title { font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#111827; }
    .label { font:650 22px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#111827; }
    .small { font:500 18px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#475569; }
    .equation { font:650 25px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#111827; }
    .layer { fill:#dbeafe; stroke:#2563eb; stroke-width:3; }
    .metal { fill:#e2e8f0; stroke:#111827; stroke-width:3; }
    .contact { fill:#fff7ed; stroke:#f59e0b; stroke-width:3; }
    .lead { fill:none; stroke:#64748b; stroke-width:8; stroke-linecap:round; }
    .call { fill:none; stroke:#64748b; stroke-width:2.5; }
    .warnbox { fill:#fef2f2; stroke:#dc2626; stroke-width:2.5; rx:12; }
    .red { font:600 19px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#dc2626; }
  </style>

  <text class="title" x="600" y="55" text-anchor="middle">A contact-chain measurement contains more than contacts</text>
  <text class="small" x="600" y="87" text-anchor="middle">Simplified current path; dimensions and individual contributions are not to scale</text>

  <path class="lead" d="M70 290h115M1015 290h115"/>
  <circle cx="70" cy="290" r="13" fill="#ffffff" stroke="#64748b" stroke-width="5"/>
  <circle cx="1130" cy="290" r="13" fill="#ffffff" stroke="#64748b" stroke-width="5"/>
  <text class="label" x="70" y="255" text-anchor="middle">High</text>
  <text class="label" x="1130" y="255" text-anchor="middle">Low</text>

  <rect class="layer" x="185" y="320" width="830" height="85" rx="10"/>
  <text class="label" x="600" y="373" text-anchor="middle">Semiconductor layer contribution</text>

  <g>
    <rect class="metal" x="185" y="245" width="115" height="45" rx="6"/>
    <rect class="contact" x="225" y="290" width="35" height="30"/>
    <rect class="metal" x="325" y="245" width="115" height="45" rx="6"/>
    <rect class="contact" x="365" y="290" width="35" height="30"/>
    <rect class="metal" x="465" y="245" width="115" height="45" rx="6"/>
    <rect class="contact" x="505" y="290" width="35" height="30"/>
    <rect class="metal" x="605" y="245" width="115" height="45" rx="6"/>
    <rect class="contact" x="645" y="290" width="35" height="30"/>
    <rect class="metal" x="745" y="245" width="115" height="45" rx="6"/>
    <rect class="contact" x="785" y="290" width="35" height="30"/>
    <rect class="metal" x="885" y="245" width="130" height="45" rx="6"/>
    <rect class="contact" x="925" y="290" width="35" height="30"/>
  </g>

  <path d="M260 272h65M400 272h65M540 272h65M680 272h65M820 272h65" stroke="#111827" stroke-width="5"/>
  <text class="small" x="600" y="222" text-anchor="middle">Metal path</text>

  <path class="call" d="M242 320v92h-78"/>
  <text class="label" x="58" y="427">Contact 1</text>
  <path class="call" d="M942 320v92h94"/>
  <text class="label" x="1038" y="427">Contact N</text>
  <text class="small" x="600" y="438" text-anchor="middle">Multiple contacts amplify the interface contribution</text>

  <rect x="130" y="490" width="940" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="12"/>
  <text class="equation" x="600" y="534" text-anchor="middle">Rmeasured ≈ N·Rc + Rlayer + Rmetal + Rlead</text>

  <rect class="warnbox" x="270" y="590" width="660" height="50"/>
  <text class="red" x="600" y="622" text-anchor="middle">Dividing by N does not make the other terms disappear.</text>
</svg>
