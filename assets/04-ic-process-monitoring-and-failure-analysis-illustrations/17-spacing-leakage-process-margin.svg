<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Spacing, leakage tendency, and process margin</title>
  <desc id="desc">As contact-to-poly spacing decreases from S1 to S6, leakage stays low at first and then rises rapidly through a transition region.</desc>
  <defs><style>.bg{fill:#fbfaf7}.ink{fill:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:16px;fill:#475569}.axis{stroke:#334155;stroke-width:2}.curve{stroke:#c45d35;stroke-width:5;fill:none}.safe{fill:#dcece7}.transition{fill:#fff0cf}.risk{fill:#f6d2c8}.dash{stroke:#334155;stroke-width:2;stroke-dasharray:8 7}.dot{fill:#c45d35;stroke:#fff;stroke-width:3}</style></defs>
  <rect class="bg" width="1200" height="675"/><text class="ink h" x="600" y="58" text-anchor="middle">Leakage may change sharply near a geometry limit</text>
  <rect class="safe" x="125" y="105" width="465" height="430"/><rect class="transition" x="590" y="105" width="230" height="430"/><rect class="risk" x="820" y="105" width="255" height="430"/>
  <line class="axis" x1="125" y1="535" x2="1075" y2="535"/><line class="axis" x1="125" y1="535" x2="125" y2="105"/>
  <text class="ink t" x="68" y="320" text-anchor="middle" transform="rotate(-90 68 320)">Leakage tendency</text><text class="ink t" x="600" y="610" text-anchor="middle">Contact-to-poly spacing decreases →</text>
  <text class="ink s" x="355" y="138" text-anchor="middle">comfortable margin</text><text class="ink s" x="705" y="138" text-anchor="middle">transition</text><text class="ink s" x="948" y="138" text-anchor="middle">high-risk region</text>
  <path class="curve" d="M190 475 C310 472 410 470 515 464 C620 455 700 430 760 380 C830 320 895 230 1010 155"/>
  <g class="ink s" text-anchor="middle"><circle class="dot" cx="230" cy="474" r="9"/><text x="230" y="510">S1</text><circle class="dot" cx="390" cy="470" r="9"/><text x="390" y="510">S2</text><circle class="dot" cx="545" cy="460" r="9"/><text x="545" y="510">S3</text><circle class="dot" cx="690" cy="420" r="9"/><text x="690" y="510">S4</text><circle class="dot" cx="835" cy="314" r="9"/><text x="835" y="510">S5</text><circle class="dot" cx="990" cy="170" r="9"/><text x="990" y="510">S6</text></g>
  <line class="dash" x1="590" y1="105" x2="590" y2="535"/><text class="ink s" x="600" y="650" text-anchor="middle">Conceptual trend only · No node, dimension, sample size, or measured leakage value</text>
</svg>
