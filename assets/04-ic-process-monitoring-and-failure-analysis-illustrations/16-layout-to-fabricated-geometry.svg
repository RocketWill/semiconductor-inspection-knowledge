<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Layout target and fabricated variation</title>
  <desc id="desc">Three nominally equal layout lines pass through lithography, overlay, and etch and emerge with exaggerated edge and spacing variation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><style>.bg{fill:#fbfaf7}.ink{fill:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:28px;font-weight:700}.t{font-size:21px}.s{font-size:16px;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.target{fill:#cfe2df;stroke:#52796f;stroke-width:2}.actual{fill:#f7c983;stroke:#b76822;stroke-width:2}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="675"/><text class="ink h" x="600" y="58" text-anchor="middle">The layout is a target, not the finished geometry</text>
  <rect class="box" x="70" y="125" width="310" height="375" rx="14"/><text class="ink t" x="225" y="165" text-anchor="middle">Nominal layout</text><rect class="target" x="125" y="205" width="45" height="225"/><rect class="target" x="203" y="205" width="45" height="225"/><rect class="target" x="281" y="205" width="45" height="225"/><text class="ink s" x="225" y="468" text-anchor="middle">equal width and spacing</text>
  <path class="line" d="M380 312 L465 312"/><rect class="box" x="465" y="205" width="270" height="214" rx="14"/><text class="ink t" x="600" y="250" text-anchor="middle">Process transfer</text><text class="ink s" x="600" y="294" text-anchor="middle">lithography</text><text class="ink s" x="600" y="326" text-anchor="middle">alignment / overlay</text><text class="ink s" x="600" y="358" text-anchor="middle">etch and local loading</text>
  <path class="line" d="M735 312 L820 312"/><rect class="box" x="820" y="125" width="310" height="375" rx="14"/><text class="ink t" x="975" y="165" text-anchor="middle">Fabricated geometry</text><path class="actual" d="M868 205 L918 211 L914 430 L873 424 Z"/><path class="actual" d="M949 208 L997 203 L1002 425 L952 432 Z"/><path class="actual" d="M1030 213 L1083 207 L1077 428 L1035 422 Z"/><text class="ink s" x="975" y="468" text-anchor="middle">edge, width, and spacing variation</text>
  <text class="ink s" x="600" y="574" text-anchor="middle">Variation is exaggerated for readability · Not to scale</text><text class="ink s" x="600" y="608" text-anchor="middle">A measured wafer dimension and a drawn layout value are different evidence</text>
</svg>
