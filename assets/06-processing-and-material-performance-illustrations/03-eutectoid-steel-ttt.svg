<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Simplified eutectoid-steel TTT diagram</title>
  <desc id="desc">Conceptual time-temperature-transformation diagram with logarithmic time, start and finish curves, pearlite and bainite regions, martensite-start temperature, and three thermal paths.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#132238" flood-opacity=".08"/></filter>
    <linearGradient id="product" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d97745" stop-opacity=".04"/><stop offset="1" stop-color="#2b6f93" stop-opacity=".08"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#f6f3ed"/>
  <rect x="36" y="30" width="1128" height="603" rx="22" fill="#fffdf9" stroke="#d9d4ca" filter="url(#shadow)"/>
  <text x="78" y="82" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17243a">Eutectoid-Steel TTT Diagram</text>
  <text x="78" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#647184">Isothermal transformation paths; time axis shown conceptually on a logarithmic scale</text>
  <g stroke="#dfe3e8" stroke-width="1"><path d="M132 194H1110 M132 282H1110 M132 370H1110 M132 458H1110 M132 546H1110"/><path d="M292 158V546 M452 158V546 M612 158V546 M772 158V546 M932 158V546"/></g>
  <path d="M132 546H1110 M132 546V158" stroke="#24344d" stroke-width="2.5"/>
  <text x="923" y="589" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Time (log scale)</text><text x="78" y="166" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Temperature</text>
  <text x="126" y="575" font-family="Inter, Arial, sans-serif" font-size="13" fill="#647184">short</text><text x="1074" y="575" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#647184">long</text>
  <path d="M831 179 C504 192 367 263 397 332 C425 400 532 430 704 456 C888 430 759 400 731 332 C706 267 823 204 1028 183Z" fill="url(#product)" opacity=".8"/>
  <path d="M831 179 C504 192 367 263 397 332 C425 400 532 430 704 456" fill="none" stroke="#c85f32" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M1028 183 C707 199 569 269 594 337 C619 402 731 431 921 456" fill="none" stroke="#2b6f93" stroke-width="5.5" stroke-linecap="round"/>
  <g transform="translate(812 137)"><path d="M0 12H38" stroke="#c85f32" stroke-width="5"/><text x="50" y="17" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#8f4628">Transformation start</text><path d="M0 40H38" stroke="#2b6f93" stroke-width="5"/><text x="50" y="45" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#255c78">Transformation finish</text></g>
  <text x="765" y="263" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#26364e">Pearlite</text><text x="741" y="404" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#26364e">Bainite</text>
  <path d="M132 482H1110" stroke="#b94b40" stroke-width="2.5" stroke-dasharray="10 8"/><text x="1022" y="470" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3d34">Ms</text><text x="857" y="523" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#26364e">Martensite region</text>
  <path d="M226 169V238H944" fill="none" stroke="#657388" stroke-width="3.5" stroke-dasharray="9 7"/><circle cx="944" cy="238" r="6" fill="#657388"/>
  <path d="M278 169V386H859" fill="none" stroke="#ba8a32" stroke-width="3.5"/><circle cx="859" cy="386" r="6" fill="#ba8a32"/>
  <path d="M330 169V524" fill="none" stroke="#b94b40" stroke-width="3.5"/><path d="M322 511L330 524L338 511" fill="none" stroke="#b94b40" stroke-width="3"/>
  <g transform="translate(157 252)"><rect width="224" height="58" rx="13" fill="#f6f8fa" stroke="#ced5de"/><text x="16" y="24" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#445166">High-temperature hold</text><text x="16" y="44" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">Pearlite path</text></g>
  <g transform="translate(306 401)"><rect width="224" height="58" rx="13" fill="#fff9ef" stroke="#e2cca7"/><text x="16" y="24" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#8b671f">Lower-temperature hold</text><text x="16" y="44" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">Bainite path</text></g>
  <g transform="translate(347 489)"><rect width="268" height="52" rx="13" fill="#fff5f3" stroke="#e4b7b0"/><text x="16" y="22" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#923b34">Rapid quench below Ms</text><text x="16" y="41" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">Diffusionless martensitic path</text></g>
  <path d="M397 332L446 306" stroke="#8792a2" stroke-width="1.5"/><text x="456" y="302" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#5f6b7b">Nose: driving force vs diffusion</text>
  <text x="78" y="614" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7a8493">Conceptual TTT diagram · Not a heat-treatment specification for a particular steel</text>
</svg>
