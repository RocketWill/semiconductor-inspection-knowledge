  <path d="M1110 181 C918 207 776 278 612 367" fill="none" stroke="#c85f32" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M132 367H1110" stroke="#c85f32" stroke-width="4"/>
  <path d="M334 367 C330 421 314 477 278 546 M912 367 C913 416 925 470 960 546" fill="none" stroke="#c85f32" stroke-width="4"/>
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#26364e"><text x="597" y="185">L</text><text x="337" y="278">L + α</text><text x="839" y="286">L + β</text><text x="562" y="506">α + β</text><text x="204" y="468">α</text><text x="1015" y="468">β</text></g>
  <circle cx="612" cy="367" r="8" fill="#b94b40" stroke="#fffdf9" stroke-width="3"/><path d="M621 358L688 315" stroke="#8792a2" stroke-width="1.5"/><text x="697" y="310" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3d34">Eutectic point</text>
  <path d="M318 469H925" stroke="#2b6f93" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M510 469V546" stroke="#2b6f93" stroke-width="2" stroke-dasharray="6 6"/>
