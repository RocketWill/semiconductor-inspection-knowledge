<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Binary eutectic phase diagram and lever rule</title>
  <desc id="desc">Conceptual binary eutectic phase diagram showing phase regions, the eutectic point, a tie line, and three composition positions used by the lever rule.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#132238" flood-opacity=".08"/></filter>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b6f93" stop-opacity=".12"/><stop offset="1" stop-color="#2b6f93" stop-opacity=".02"/></linearGradient>
    <linearGradient id="solid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d97745" stop-opacity=".04"/><stop offset="1" stop-color="#d97745" stop-opacity=".12"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#f6f3ed"/>
  <rect x="36" y="30" width="1128" height="603" rx="22" fill="#fffdf9" stroke="#d9d4ca" filter="url(#shadow)"/>
  <text x="78" y="82" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17243a">Binary Eutectic Diagram and Lever Rule</text>
  <text x="78" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#647184">Equilibrium phase fields, tie-line compositions, and opposite-side segments</text>
