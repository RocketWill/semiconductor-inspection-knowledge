  <text x="984" y="589" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Composition (wt% B)</text>
  <text x="80" y="166" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Temperature</text>
  <text x="124" y="575" font-family="Inter, Arial, sans-serif" font-size="14" fill="#647184">0</text><text x="1084" y="575" font-family="Inter, Arial, sans-serif" font-size="14" fill="#647184">100</text>
  <path d="M132 168 C310 201 451 276 612 367 C776 278 918 207 1110 181 L1110 158H132Z" fill="url(#liquid)"/>
  <path d="M132 367H1110V546H960 C925 470 913 416 912 367H612H334 C330 421 314 477 278 546H132Z" fill="url(#solid)"/>
