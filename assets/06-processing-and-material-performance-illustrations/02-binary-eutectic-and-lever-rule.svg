  <text x="528" y="453" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b6f93">Tie line</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b6f93"><text x="282" y="497">Cα = 20</text><text x="475" y="531">C₀ = 40</text><text x="889" y="497">Cβ = 80</text></g>
  <g transform="translate(735 395)"><rect width="330" height="58" rx="13" fill="#f4f8fa" stroke="#bed0db"/><text x="18" y="25" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#255c78">Opposite-side segment</text><text x="18" y="45" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">Wα uses Cβ − C₀; Wβ uses C₀ − Cα</text></g>
  <text x="78" y="614" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7a8493">Conceptual equilibrium diagram · Phase boundaries and compositions are illustrative</text>
</svg>
