<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Engineering stress–strain curve</title>
  <desc id="desc">Conceptual tensile curve marking elastic modulus, yield strength, ultimate tensile strength, ductility, necking, fracture, and tensile toughness.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d97745" stop-opacity=".22"/><stop offset="1" stop-color="#d97745" stop-opacity=".03"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#132238" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1200" height="675" fill="#f6f3ed"/>
  <rect x="36" y="30" width="1128" height="603" rx="22" fill="#fffdf9" stroke="#d9d4ca" filter="url(#shadow)"/>
  <text x="78" y="82" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17243a">Engineering Stress–Strain Response</text>
  <text x="78" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#647184">A single tensile curve answers several different mechanical questions</text>
  <g stroke="#dfe3e8" stroke-width="1">
    <path d="M126 184H1110 M126 268H1110 M126 352H1110 M126 436H1110 M126 520H1110"/>
    <path d="M286 150V548 M446 150V548 M606 150V548 M766 150V548 M926 150V548"/>
  </g>
  <path d="M126 548H1110 M126 548V150" stroke="#24344d" stroke-width="2.5"/>
  <text x="984" y="590" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Engineering strain, ε</text>
  <text x="78" y="160" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Engineering stress, σ</text>
  <path d="M126 548 L298 324 C322 294 357 287 398 284 C530 276 666 213 800 197 C871 188 925 209 961 251 C1000 296 1038 389 1062 470 L1062 548 Z" fill="url(#area)"/>
  <path d="M126 548 L298 324 C322 294 357 287 398 284 C530 276 666 213 800 197 C871 188 925 209 961 251 C1000 296 1038 389 1062 470" fill="none" stroke="#c85f32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 548L271 359" stroke="#2b6f93" stroke-width="4"/>
  <text x="186" y="426" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b6f93">Slope = E</text>
  <path d="M176 548L332 344" stroke="#2b6f93" stroke-width="2" stroke-dasharray="8 7"/>
  <circle cx="332" cy="302" r="7" fill="#2b6f93" stroke="#fffdf9" stroke-width="3"/>
  <path d="M332 302L388 244" stroke="#758297" stroke-width="1.5"/>
  <text x="397" y="238" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#26364e">0.2% offset yield</text>
  <circle cx="800" cy="197" r="7" fill="#c85f32" stroke="#fffdf9" stroke-width="3"/>
  <path d="M800 197V158" stroke="#758297" stroke-width="1.5"/>
  <text x="730" y="148" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#26364e">Ultimate tensile strength</text>
  <path d="M1062 470V548" stroke="#758297" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="1010" y="455" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#26364e">Fracture</text>
  <text x="493" y="327" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6b7b">Strain hardening</text>
  <text x="922" y="330" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6b7b">Necking</text>
  <g transform="translate(430 470)">
    <rect width="330" height="54" rx="12" fill="#fff8ef" stroke="#e5c6ae"/>
    <circle cx="24" cy="27" r="7" fill="#d97745"/>
    <text x="42" y="23" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#26364e">Area under the curve</text>
    <text x="42" y="42" font-family="Inter, Arial, sans-serif" font-size="14" fill="#687487">Tensile toughness (energy per volume)</text>
  </g>
  <text x="78" y="616" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7a8493">Conceptual ductile-metal response · Not to scale</text>
</svg>
