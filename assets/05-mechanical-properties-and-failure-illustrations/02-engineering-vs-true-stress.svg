<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Engineering stress and true stress after necking</title>
  <desc id="desc">Conceptual comparison showing engineering stress falling after necking while true stress continues upward as local area decreases.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#132238" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="675" fill="#f6f3ed"/>
  <rect x="36" y="30" width="1128" height="603" rx="22" fill="#fffdf9" stroke="#d9d4ca" filter="url(#shadow)"/>
  <text x="78" y="82" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17243a">Engineering Stress vs True Stress</text>
  <text x="78" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#647184">The two measures separate once deformation localizes</text>
  <g stroke="#dfe3e8"><path d="M126 184H1110 M126 268H1110 M126 352H1110 M126 436H1110 M126 520H1110"/><path d="M286 150V548 M446 150V548 M606 150V548 M766 150V548 M926 150V548"/></g>
  <path d="M126 548H1110 M126 548V150" stroke="#24344d" stroke-width="2.5"/>
  <text x="1028" y="590" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Strain</text>
  <text x="78" y="160" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3f4d61">Stress</text>
  <path d="M126 548 C220 413 291 326 378 292 C515 272 650 225 778 207 C846 198 893 219 928 266 C966 317 1008 410 1058 472" fill="none" stroke="#c85f32" stroke-width="6" stroke-linecap="round"/>
  <path d="M126 548 C220 413 291 326 378 292 C515 272 650 225 778 207 C874 192 961 156 1058 105" fill="none" stroke="#2b6f93" stroke-width="6" stroke-linecap="round"/>
  <path d="M778 144V548" stroke="#8a95a5" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="720" y="552" width="116" height="30" rx="15" fill="#26364e"/>
  <text x="778" y="573" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Necking begins</text>
  <g transform="translate(842 174)"><rect width="254" height="102" rx="14" fill="#f7f9fb" stroke="#d8dee6"/><path d="M20 30H62" stroke="#2b6f93" stroke-width="5"/><text x="76" y="35" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#26364e">True stress</text><text x="76" y="55" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">uses instantaneous area A</text><path d="M20 78H62" stroke="#c85f32" stroke-width="5"/><text x="76" y="83" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#26364e">Engineering stress</text><text x="76" y="101" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">uses original area A₀</text></g>
  <g transform="translate(833 362)"><rect width="266" height="78" rx="14" fill="#fff8ef" stroke="#e5c6ae"/><text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#26364e">Local area shrinks rapidly</text><text x="18" y="54" font-family="Inter, Arial, sans-serif" font-size="14" fill="#687487">Uniform-deformation conversion no longer applies</text></g>
  <text x="78" y="616" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7a8493">Conceptual comparison · Local neck stress requires additional measurement and correction</text>
</svg>
