  <g transform="translate(710 205)"><rect width="331" height="68" rx="14" fill="#fff7f4" stroke="#e4b7b0"/><circle cx="23" cy="23" r="7" fill="#b94b40"/><text x="42" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#8f3730">KI ≥ KIC</text><text x="42" y="50" font-family="Inter, Arial, sans-serif" font-size="14" fill="#687487">Unstable crack growth may occur</text></g>
  <g transform="translate(641 432)"><rect width="331" height="68" rx="14" fill="#f2f8f5" stroke="#b9d2c8"/><circle cx="23" cy="23" r="7" fill="#4f8a75"/><text x="42" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#346b58">KI &lt; KIC</text><text x="42" y="50" font-family="Inter, Arial, sans-serif" font-size="14" fill="#687487">Below the idealized critical boundary</text></g>
  <g transform="translate(218 371)"><rect width="290" height="72" rx="14" fill="#fffdf9" stroke="#d8dee6"/><text x="18" y="29" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#26364e">σc = KIC / (Y√πa)</text><text x="18" y="53" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">Crack definition and geometry factor must match</text></g>
  <text x="78" y="616" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7a8493">Conceptual LEFM relation · Requires valid geometry, loading mode, and small-scale yielding</text>
