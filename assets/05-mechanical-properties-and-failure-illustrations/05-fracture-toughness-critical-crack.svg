  <path d="M152 166 C235 254 347 344 485 408 C647 483 846 516 1080 532 L1080 548H152Z" fill="url(#safe)"/>
  <path d="M126 150H1110V548H1080V532 C846 516 647 483 485 408 C347 344 235 254 152 166Z" fill="url(#critical)"/>
