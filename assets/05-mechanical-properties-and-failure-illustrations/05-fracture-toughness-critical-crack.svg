<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Critical stress decreases as crack size increases</title>
  <desc id="desc">Fracture-mechanics boundary separating conditions below and above critical Mode I stress intensity.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#132238" flood-opacity=".08"/></filter><linearGradient id="safe" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4f8a75" stop-opacity=".05"/><stop offset="1" stop-color="#4f8a75" stop-opacity=".18"/></linearGradient><linearGradient id="critical" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b94b40" stop-opacity=".14"/><stop offset="1" stop-color="#b94b40" stop-opacity=".03"/></linearGradient></defs>
  <rect width="1200" height="675" fill="#f6f3ed"/><rect x="36" y="30" width="1128" height="603" rx="22" fill="#fffdf9" stroke="#d9d4ca" filter="url(#shadow)"/>
  <text x="78" y="82" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17243a">Crack Size Changes the Allowable Stress</text>
  <text x="78" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#647184">Mode I, linear-elastic conceptual boundary</text>
