<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Three stages of creep</title>
  <desc id="desc">Conceptual strain-time curve at constant stress and temperature, showing primary, secondary, and tertiary creep.</desc>
  <defs><linearGradient id="creepArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d97745" stop-opacity=".22"/><stop offset="1" stop-color="#d97745" stop-opacity=".02"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#132238" flood-opacity=".08"/></filter></defs>
