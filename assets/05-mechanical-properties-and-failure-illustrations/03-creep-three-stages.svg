  <text x="202" y="327" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5e6b7d">Decreasing rate</text><text x="492" y="248" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5e6b7d">Near-steady rate</text><text x="873" y="176" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5e6b7d">Accelerating damage</text>
  <path d="M490 334L681 296" stroke="#2b6f93" stroke-width="3"/><text x="524" y="366" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2b6f93">Slope = ε̇ₛ</text>
  <g transform="translate(822 366)"><rect width="248" height="86" rx="14" fill="#fff8ef" stroke="#e5c6ae"/><text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#26364e">Mechanism check required</text><text x="18" y="53" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">A fitted Arrhenius line is valid only</text><text x="18" y="71" font-family="Inter, Arial, sans-serif" font-size="13" fill="#687487">while the dominant mechanism remains consistent.</text></g>
