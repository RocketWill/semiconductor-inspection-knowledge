  <rect x="126" y="150" width="260" height="398" fill="#2b6f93" opacity=".035"/><rect x="386" y="150" width="400" height="398" fill="#d97745" opacity=".035"/><rect x="786" y="150" width="282" height="398" fill="#b54e42" opacity=".04"/>
  <path d="M126 520 C188 404 278 360 386 339 C520 315 665 286 786 260 C914 233 992 183 1068 88 L1068 548H126Z" fill="url(#creepArea)"/>
  <path d="M126 520 C188 404 278 360 386 339 C520 315 665 286 786 260 C914 233 992 183 1068 88" fill="none" stroke="#c85f32" stroke-width="6" stroke-linecap="round"/>
