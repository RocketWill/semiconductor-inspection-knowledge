  <text x="78" y="82" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17243a">Creep Under Constant Stress and Temperature</text>
  <text x="78" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#647184">Strain accumulates with time; the controlling mechanism may still change</text>
