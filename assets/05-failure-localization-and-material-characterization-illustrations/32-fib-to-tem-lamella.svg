<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">FIB to TEM lamella preparation</title><desc id="desc">A five-stage sequence moves from a localized target through protection, trench milling, lift-out, mounting, and final thinning.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker><style>.bg{fill:#fcfcfb}.ink{fill:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:17px;font-weight:650}.small{font-size:14px;fill:#52606d}.micro{font-size:13px;fill:#697684}.rule{stroke:#d5dbe0;stroke-width:1}.stage{fill:#fff;stroke:#8b969f;stroke-width:1.4}.sample{fill:#e6efeb;stroke:#4c7167;stroke-width:1.5}.protect{fill:#efbd70;stroke:#a76525;stroke-width:1.2}.target{fill:#d85c48}.void{fill:#fcfcfb;stroke:#4c7167;stroke-width:1;stroke-dasharray:4 3}.probe{stroke:#3b7189;stroke-width:3}.flow{stroke:#52606d;stroke-width:1.8;marker-end:url(#arrow)}.thin{fill:#dcebf2;stroke:#3b7189;stroke-width:1.3}</style></defs>
  <rect class="bg" width="1200" height="675"/><text class="ink label" x="68" y="52">SITE-SPECIFIC LAMELLA PREPARATION</text><text class="ink small" x="68" y="78">Each step preserves less material and demands better positional control</text><line class="rule" x1="68" y1="102" x2="1132" y2="102"/>
  <g transform="translate(58 166)"><rect class="stage" width="194" height="306" rx="3"/><text class="ink label" x="97" y="34" text-anchor="middle">1 · Locate and protect</text><rect class="sample" x="24" y="150" width="146" height="86"/><circle class="target" cx="97" cy="190" r="7"/><rect class="protect" x="61" y="126" width="72" height="24"/><text class="ink micro" x="97" y="268" text-anchor="middle">target remains registered</text></g>
  <line class="flow" x1="252" y1="319" x2="278" y2="319"/>
  <g transform="translate(278 166)"><rect class="stage" width="194" height="306" rx="3"/><text class="ink label" x="97" y="34" text-anchor="middle">2 · Mill trenches</text><path class="sample" d="M24 150H62L76 226H118L132 150H170V236H24Z"/><rect class="protect" x="61" y="126" width="72" height="24"/><rect class="target" x="92" y="168" width="10" height="58"/><text class="ink micro" x="97" y="268" text-anchor="middle">leave a thin target slab</text></g>
  <line class="flow" x1="472" y1="319" x2="498" y2="319"/>
  <g transform="translate(498 166)"><rect class="stage" width="194" height="306" rx="3"/><text class="ink label" x="97" y="34" text-anchor="middle">3 · Lift out</text><line class="probe" x1="150" y1="94" x2="111" y2="154"/><rect class="thin" x="79" y="145" width="34" height="96" transform="rotate(18 96 193)"/><text class="ink micro" x="97" y="268" text-anchor="middle">transfer with a probe</text></g>
  <line class="flow" x1="692" y1="319" x2="718" y2="319"/>
  <g transform="translate(718 166)"><rect class="stage" width="194" height="306" rx="3"/><text class="ink label" x="97" y="34" text-anchor="middle">4 · Mount</text><path class="sample" d="M38 230V126H70V230M124 230V126H156V230"/><rect class="thin" x="68" y="144" width="58" height="90"/><text class="ink micro" x="97" y="268" text-anchor="middle">attach to a support</text></g>
  <line class="flow" x1="912" y1="319" x2="938" y2="319"/>
  <g transform="translate(938 166)"><rect class="stage" width="194" height="306" rx="3"/><text class="ink label" x="97" y="34" text-anchor="middle">5 · Thin</text><path class="sample" d="M38 230V126H70V230M124 230V126H156V230"/><rect class="thin" x="90" y="142" width="14" height="92"/><path class="void" d="M70 142H90V234H70M104 142H124V234H104"/><text class="ink micro" x="97" y="268" text-anchor="middle">final lamella for analysis</text></g>
  <text class="ink small" x="600" y="523" text-anchor="middle">Localization accuracy, protection, milling progress, and remaining thickness all affect what reaches the final sample.</text><line class="rule" x1="68" y1="594" x2="1132" y2="594"/><text class="ink micro" x="68" y="622">CONCEPTUAL SEQUENCE · NOT TO SCALE · No equipment recipe, material-specific endpoint, or final thickness is prescribed.</text>
</svg>
