<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">From emission hotspot to verified evidence</title>
  <desc id="desc">A simulated emission map aligns with a simplified layout region, followed by evidence gates for repeatability, structure localization, and physical verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff4a8" stop-opacity="1"/><stop offset=".32" stop-color="#efa13d" stop-opacity=".8"/><stop offset="1" stop-color="#d95d48" stop-opacity="0"/></radialGradient>
    <style>
      .bg{fill:#fcfcfb}.ink{fill:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#52606d}.micro{font-size:13px;fill:#697684}.rule{stroke:#d5dbe0;stroke-width:1}.dark{fill:#1d2730;stroke:#52606d;stroke-width:1.5}.layout{fill:#f3f5f6;stroke:#52606d;stroke-width:1.5}.metal{fill:#d5dfe5;stroke:#52606d;stroke-width:1}.active{fill:#dcebe6;stroke:#4c7167;stroke-width:1}.gate{fill:#efbd70;stroke:#a76525;stroke-width:1}.coord{stroke:#7d8993;stroke-width:1;stroke-dasharray:4 4}.box{fill:#fff;stroke:#52606d;stroke-width:1.5}.risk{fill:#fff3e1;stroke:#a76525;stroke-width:1.5}.verified{fill:#e6efeb;stroke:#4c7167;stroke-width:2}.flow{fill:none;stroke:#52606d;stroke-width:1.8;marker-end:url(#arrow)}.limit{stroke:#b94b3f;stroke-width:2;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="ink label" x="68" y="52">ALIGN THE LOCATION FIRST</text><text class="ink small" x="68" y="78">A hotspot becomes useful when its condition and nearby structure are preserved</text>
  <line class="rule" x1="68" y1="102" x2="1132" y2="102"/>

  <rect class="dark" x="68" y="142" width="280" height="242" rx="3"/>
  <text x="88" y="171" fill="#d8e0e5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">emission image</text>
  <path d="M98 196H318M98 234H318M98 272H318M98 310H318M136 186V354M184 186V354M232 186V354M280 186V354" stroke="#53616c" stroke-width="1"/>
  <circle cx="234" cy="271" r="50" fill="url(#glow)"/><circle cx="234" cy="271" r="5" fill="#fff7c5"/>
  <line class="coord" x1="234" y1="132" x2="234" y2="394"/><line class="coord" x1="58" y1="271" x2="358" y2="271"/>
  <text class="ink micro" x="234" y="412" text-anchor="middle">hotspot coordinate under a recorded bias</text>

  <path class="flow" d="M348 263H402"/>
  <rect class="layout" x="402" y="142" width="330" height="242" rx="3"/>
  <text class="ink small" x="422" y="171">simplified layout alignment</text>
  <rect class="active" x="438" y="205" width="250" height="116"/>
  <path class="metal" d="M454 184H520V342H486V234H454Z"/><path class="metal" d="M604 184H672V342H638V234H604Z"/>
  <rect class="gate" x="546" y="190" width="34" height="148"/>
  <circle cx="562" cy="271" r="27" fill="none" stroke="#b94b3f" stroke-width="2"/>
  <line class="coord" x1="562" y1="132" x2="562" y2="394"/><line class="coord" x1="392" y1="271" x2="742" y2="271"/>
  <text class="ink micro" x="454" y="365">candidate region, not a named defect</text>

  <line class="limit" x1="774" y1="142" x2="774" y2="384"/>
  <text class="ink label" x="808" y="180">What is known</text>
  <text class="ink small" x="808" y="211">• location under this condition</text><text class="ink small" x="808" y="238">• nearby layout structures</text><text class="ink small" x="808" y="265">• relative emission intensity</text>
  <text class="ink label" x="808" y="312">What remains open</text>
  <text class="ink small" x="808" y="343">physical defect · material · process origin</text>

  <text class="ink label" x="68" y="470">EVIDENCE GATES</text><line class="rule" x1="68" y1="492" x2="1132" y2="492"/>
  <rect class="risk" x="68" y="525" width="210" height="66" rx="3"/><text class="ink label" x="173" y="553" text-anchor="middle">Emission hotspot</text><text class="ink micro" x="173" y="576" text-anchor="middle">observation</text>
  <path class="flow" d="M278 558H330"/>
  <rect class="box" x="330" y="525" width="210" height="66" rx="3"/><text class="ink label" x="435" y="553" text-anchor="middle">Repeatable fail</text><text class="ink micro" x="435" y="576" text-anchor="middle">bias · current · settings</text>
  <path class="flow" d="M540 558H592"/>
  <rect class="box" x="592" y="525" width="210" height="66" rx="3"/><text class="ink label" x="697" y="553" text-anchor="middle">Localized structure</text><text class="ink micro" x="697" y="576" text-anchor="middle">layout and electrical path</text>
  <path class="flow" d="M802 558H854"/>
  <rect class="verified" x="854" y="525" width="278" height="66" rx="3"/><text class="ink label" x="993" y="553" text-anchor="middle">Independent verification</text><text class="ink micro" x="993" y="576" text-anchor="middle">cross-section · material · electrical</text>

  <text class="ink micro" x="68" y="638">SIMULATED CONCEPT · No customer layout, die image, production coordinate, or equipment setting is shown.</text>
</svg>
