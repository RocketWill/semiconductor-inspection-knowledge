<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Voltage contrast and beam-dependent polarity</title><desc id="desc">Grounded and floating conductors show different charge-removal paths and surface potentials, while a lower panel warns that image polarity depends on beam conditions.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker><style>.bg{fill:#fcfcfb}.ink{fill:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#52606d}.micro{font-size:13px;fill:#697684}.rule{stroke:#d5dbe0;stroke-width:1}.panelG{fill:#f3f8f5;stroke:#4c7167;stroke-width:1.5}.panelF{fill:#fff7eb;stroke:#a76525;stroke-width:1.5}.metal{fill:#d6e0e6;stroke:#52606d;stroke-width:1.5}.beam{stroke:#3b7189;stroke-width:3;marker-end:url(#arrow)}.se{fill:none;stroke:#b94b3f;stroke-width:1.8;marker-end:url(#arrow)}.ground{fill:none;stroke:#4c7167;stroke-width:2}.chargeP{fill:#fff;stroke:#b94b3f;stroke-width:1.5}.chargeN{fill:#fff;stroke:#3b7189;stroke-width:1.5}.state{fill:#fff;stroke:#c3cbd1;stroke-width:1.2}.warning{fill:#fff;stroke:#b94b3f;stroke-width:1.5}.path{fill:none;stroke:#52606d;stroke-width:1.6;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="675"/><text class="ink label" x="68" y="52">VOLTAGE CONTRAST</text><text class="ink small" x="68" y="78">Surface potential changes secondary-electron collection and image brightness</text><line class="rule" x1="68" y1="102" x2="1132" y2="102"/>
  <rect class="panelG" x="68" y="136" width="470" height="292" rx="3"/><text class="ink label" x="96" y="173">Conductive path to ground</text><line class="beam" x1="303" y1="190" x2="303" y2="260"/><rect class="metal" x="154" y="274" width="298" height="50" rx="3"/><path class="ground" d="M303 324V360M276 360H330M284 371H322M292 382H314"/><path class="se" d="M286 275L249 226"/><path class="se" d="M303 273V215"/><path class="se" d="M320 275L357 226"/><text class="ink small" x="96" y="405">charge can be removed through the path</text>
  <rect class="panelF" x="594" y="136" width="538" height="292" rx="3"/><text class="ink label" x="622" y="173">Floating node</text><rect class="state" x="620" y="192" width="174" height="66" rx="3"/><circle class="chargeP" cx="644" cy="225" r="13"/><text class="ink small" x="644" y="230" text-anchor="middle">+</text><text class="ink micro" x="666" y="218">below crossover</text><text class="ink micro" x="666" y="240">net positive</text><rect class="state" x="932" y="192" width="174" height="66" rx="3"/><circle class="chargeN" cx="956" cy="225" r="13"/><text class="ink small" x="956" y="230" text-anchor="middle">−</text><text class="ink micro" x="978" y="218">above crossover</text><text class="ink micro" x="978" y="240">net negative</text><line class="beam" x1="863" y1="188" x2="863" y2="271"/><rect class="metal" x="714" y="285" width="298" height="50" rx="3"/><line x1="863" y1="335" x2="863" y2="375" stroke="#8b969f" stroke-width="2" stroke-dasharray="5 4"/><text class="ink small" x="863" y="401" text-anchor="middle">no defined discharge path</text>
  <text class="ink label" x="68" y="478">POLARITY CHECK</text><line class="rule" x1="68" y1="499" x2="1132" y2="499"/>
  <rect class="warning" x="68" y="526" width="1064" height="72" rx="3"/><text class="ink label" x="96" y="556">Brightness is not a universal connectivity label.</text><text class="ink small" x="96" y="582">Electron or ion beam, landing energy, scan history, grounding, and detector condition can change whether a floating node appears bright or dark.</text>
  <text class="ink micro" x="68" y="638">CONCEPTUAL VC RESPONSE · No fixed bright/dark polarity, beam setting, device layout, or production image is implied.</text>
</svg>
