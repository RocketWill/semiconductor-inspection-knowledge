<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Charge collection and gate oxide stress during plasma processing</title>
  <desc id="desc">A technical cross-section shows plasma charge collected by a temporarily floating conductor and a conceptual stress path through a connected gate oxide.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2f6f8f"/></marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b94b3f"/></marker>
    <style>
      .bg{fill:#fcfcfb}.ink{fill:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#52606d}.micro{font-size:13px;fill:#697684}.rule{stroke:#d5dbe0;stroke-width:1}.metal{fill:#d8e0e6;stroke:#364856;stroke-width:2}.via{fill:#8796a2;stroke:#364856;stroke-width:2}.oxide{fill:#efb65c;stroke:#9a6421;stroke-width:1.5}.silicon{fill:#dbeae6;stroke:#426d65;stroke-width:2}.charge{fill:#e7f1f6;stroke:#2f6f8f;stroke-width:1.5}.collect{fill:none;stroke:#2f6f8f;stroke-width:2;marker-end:url(#arrowBlue)}.stress{fill:none;stroke:#b94b3f;stroke-width:3;stroke-dasharray:7 6;marker-end:url(#arrowRed)}.guide{fill:none;stroke:#7d8993;stroke-width:1.5}.dim{fill:none;stroke:#7d8993;stroke-width:1;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="ink label" x="72" y="54">PROCESS STATE</text>
  <text class="ink small" x="72" y="80">Temporary electrical condition during a plasma step</text>
  <line class="rule" x1="72" y1="103" x2="1128" y2="103"/>

  <g aria-label="plasma region">
    <text class="ink small" x="112" y="143">plasma environment</text>
    <circle class="charge" cx="178" cy="180" r="16"/><text class="ink small" x="178" y="186" text-anchor="middle">+</text>
    <circle class="charge" cx="302" cy="160" r="16"/><text class="ink small" x="302" y="166" text-anchor="middle">−</text>
    <circle class="charge" cx="430" cy="188" r="16"/><text class="ink small" x="430" y="194" text-anchor="middle">+</text>
    <circle class="charge" cx="558" cy="158" r="16"/><text class="ink small" x="558" y="164" text-anchor="middle">−</text>
    <path class="collect" d="M178 202V255"/><path class="collect" d="M302 182V255"/><path class="collect" d="M430 210V255"/><path class="collect" d="M558 180V255"/>
  </g>

  <rect class="metal" x="112" y="260" width="650" height="54" rx="3"/>
  <text class="ink label" x="437" y="294" text-anchor="middle">temporarily floating conductor</text>
  <path class="metal" d="M720 314H792V377H846V410H800V415H762V365H720Z"/>
  <text class="ink small" x="792" y="342" text-anchor="middle">interconnect</text>

  <rect class="metal" x="816" y="410" width="82" height="38" rx="2"/>
  <text class="ink small" x="857" y="399" text-anchor="middle">gate</text>
  <rect class="oxide" x="804" y="448" width="106" height="10"/>
  <rect class="silicon" x="696" y="458" width="326" height="116" rx="2"/>
  <rect class="via" x="934" y="492" width="54" height="34" rx="2"/>
  <text class="ink small" x="857" y="483" text-anchor="middle">thin gate oxide</text>
  <text class="ink label" x="857" y="548" text-anchor="middle">silicon device region</text>

  <path class="stress" d="M664 287H742V345H778V426H857V493"/>
  <text class="ink label" x="972" y="298">possible stress path</text>
  <path class="guide" d="M956 305H810"/>
  <text class="ink small" x="972" y="329">charge reaches a connected gate</text>
  <text class="ink small" x="972" y="351">before a normal discharge path exists</text>

  <line class="dim" x1="112" y1="337" x2="762" y2="337"/>
  <line class="dim" x1="112" y1="325" x2="112" y2="348"/><line class="dim" x1="762" y1="325" x2="762" y2="348"/>
  <text class="ink micro" x="437" y="360" text-anchor="middle">exposed area or perimeter contributes to the antenna check</text>

  <line class="rule" x1="72" y1="610" x2="1128" y2="610"/>
  <text class="ink micro" x="72" y="638">CONCEPTUAL CROSS-SECTION · NOT TO SCALE · No process voltage, layer stack, antenna ratio, or damage location is implied.</text>
</svg>
