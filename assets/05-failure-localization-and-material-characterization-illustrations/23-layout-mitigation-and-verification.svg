<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Layout prevention and the evidence needed after failure</title>
  <desc id="desc">Two aligned prevention tracks for antenna effect and latch-up sit above an evidence ladder from layout condition to verified physical cause.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker>
    <style>
      .bg{fill:#fcfcfb}.ink{fill:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#52606d}.micro{font-size:13px;fill:#697684}.rule{stroke:#d5dbe0;stroke-width:1}.bandA{fill:#e8f1f5;stroke:#3b7189;stroke-width:1.5}.bandL{fill:#e6efeb;stroke:#4c7167;stroke-width:1.5}.tag{fill:#fff;stroke:#8b969f;stroke-width:1.3}.risk{fill:#fff3e1;stroke:#a76525;stroke-width:1.5}.evidence{fill:#fff;stroke:#52606d;stroke-width:1.5}.verified{fill:#edf3ee;stroke:#4c7167;stroke-width:2}.flow{fill:none;stroke:#52606d;stroke-width:1.8;marker-end:url(#arrow)}.limit{stroke:#b94b3f;stroke-width:2;stroke-dasharray:6 5}.num{font-size:13px;font-weight:700;fill:#fff}.numdot{fill:#52606d}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="ink label" x="68" y="51">LAYOUT-LEVEL PREVENTION</text>
  <line class="rule" x1="68" y1="74" x2="1132" y2="74"/>

  <rect class="bandA" x="68" y="104" width="206" height="118" rx="3"/>
  <text class="ink label" x="92" y="140">Antenna Effect</text>
  <text class="ink small" x="92" y="170">change the temporary</text><text class="ink small" x="92" y="193">charge path</text>
  <rect class="tag" x="304" y="104" width="188" height="50" rx="3"/><text class="ink small" x="398" y="135" text-anchor="middle">jumper routing</text>
  <rect class="tag" x="304" y="172" width="188" height="50" rx="3"/><text class="ink small" x="398" y="203" text-anchor="middle">antenna diode</text>
  <path class="flow" d="M274 163H293"/>
  <text class="ink micro" x="518" y="132">trade-offs</text><text class="ink small" x="518" y="160">routing · area · loading</text>

  <line class="rule" x1="68" y1="247" x2="1132" y2="247"/>
  <rect class="bandL" x="68" y="276" width="206" height="118" rx="3"/>
  <text class="ink label" x="92" y="312">Latch-up</text>
  <text class="ink small" x="92" y="342">reduce injection and</text><text class="ink small" x="92" y="365">local resistance</text>
  <rect class="tag" x="304" y="276" width="188" height="50" rx="3"/><text class="ink small" x="398" y="307" text-anchor="middle">well / body contact</text>
  <rect class="tag" x="304" y="344" width="188" height="50" rx="3"/><text class="ink small" x="398" y="375" text-anchor="middle">guard ring · isolation</text>
  <path class="flow" d="M274 335H293"/>
  <text class="ink micro" x="518" y="304">trade-offs</text><text class="ink small" x="518" y="332">area · spacing · layout access</text>

  <path class="limit" d="M676 104V394"/>
  <text class="ink label" x="704" y="136">Evidence boundary</text>
  <text class="ink small" x="704" y="166">Prevention addresses a known risk.</text>
  <text class="ink small" x="704" y="190">It does not verify what happened</text>
  <text class="ink small" x="704" y="214">inside a failed device.</text>
  <text class="ink small" x="704" y="266">A rule result can guide the search,</text>
  <text class="ink small" x="704" y="290">but the mechanism still needs</text>
  <text class="ink small" x="704" y="314">independent evidence.</text>

  <text class="ink label" x="68" y="449">FAILURE INVESTIGATION</text>
  <line class="rule" x1="68" y1="472" x2="1132" y2="472"/>

  <g aria-label="evidence ladder">
    <circle class="numdot" cx="102" cy="528" r="14"/><text class="ink num" x="102" y="533" text-anchor="middle">1</text>
    <rect class="risk" x="126" y="498" width="204" height="62" rx="3"/><text class="ink label" x="228" y="526" text-anchor="middle">Layout condition</text><text class="ink micro" x="228" y="548" text-anchor="middle">risk or hypothesis</text>
    <path class="flow" d="M330 529H378"/>
    <circle class="numdot" cx="408" cy="528" r="14"/><text class="ink num" x="408" y="533" text-anchor="middle">2</text>
    <rect class="evidence" x="432" y="498" width="204" height="62" rx="3"/><text class="ink label" x="534" y="526" text-anchor="middle">Electrical fail</text><text class="ink micro" x="534" y="548" text-anchor="middle">bias · repeatability</text>
    <path class="flow" d="M636 529H684"/>
    <circle class="numdot" cx="714" cy="528" r="14"/><text class="ink num" x="714" y="533" text-anchor="middle">3</text>
    <rect class="evidence" x="738" y="498" width="174" height="62" rx="3"/><text class="ink label" x="825" y="526" text-anchor="middle">Localization</text><text class="ink micro" x="825" y="548" text-anchor="middle">affected structure</text>
    <path class="flow" d="M912 529H950"/>
    <circle class="numdot" cx="980" cy="528" r="14"/><text class="ink num" x="980" y="533" text-anchor="middle">4</text>
    <rect class="verified" x="1004" y="498" width="128" height="62" rx="3"/><text class="ink label" x="1068" y="526" text-anchor="middle">Physical</text><text class="ink micro" x="1068" y="548" text-anchor="middle">evidence</text>
  </g>
  <text class="ink small" x="68" y="608">A verified cause requires agreement across the relevant evidence levels, not a direct jump from geometry to mechanism.</text>
  <text class="ink micro" x="68" y="640">CONCEPTUAL COMPARISON · Methods and spacing are not tied to a specific process, product, or design rule.</text>
</svg>
