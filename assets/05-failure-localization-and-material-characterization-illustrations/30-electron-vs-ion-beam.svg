<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Electron beam and ion beam roles</title>
  <desc id="desc">Two panels compare signal generation under an electron beam with sputtering and site-specific material removal under an ion beam.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker>
    <style>.bg{fill:#fcfcfb}.ink{fill:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#52606d}.micro{font-size:13px;fill:#697684}.rule{stroke:#d5dbe0;stroke-width:1}.panelE{fill:#f3f8fa;stroke:#3b7189;stroke-width:1.5}.panelI{fill:#f3f7f4;stroke:#4c7167;stroke-width:1.5}.sample{fill:#dce6e3;stroke:#4c7167;stroke-width:2}.beamE{stroke:#3b7189;stroke-width:4;marker-end:url(#arrow)}.beamI{stroke:#4c7167;stroke-width:5;marker-end:url(#arrow)}.signal{fill:none;stroke:#b94b3f;stroke-width:2;marker-end:url(#arrow)}.particle{fill:#efbd70;stroke:#a76525;stroke-width:1}.cut{fill:#fcfcfb;stroke:#4c7167;stroke-width:1.5;stroke-dasharray:5 4}.tag{fill:#fff;stroke:#8b969f;stroke-width:1.2}</style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="ink label" x="68" y="52">TWO BEAMS, DIFFERENT ROLES</text><text class="ink small" x="68" y="78">Both can form images; only one is used here to remove material deliberately</text>
  <line class="rule" x1="68" y1="102" x2="1132" y2="102"/>
  <rect class="panelE" x="68" y="138" width="500" height="410" rx="3"/><text class="ink label" x="98" y="177">Electron beam</text><text class="ink small" x="98" y="204">excite signals for imaging or analysis</text>
  <line class="beamE" x1="318" y1="226" x2="318" y2="318"/><text class="ink micro" x="340" y="246">e−</text>
  <rect class="sample" x="138" y="330" width="360" height="126" rx="3"/>
  <path class="signal" d="M300 340C250 303 220 281 190 260"/><path class="signal" d="M336 340C386 303 416 281 446 260"/>
  <text class="ink small" x="162" y="245">SE / BSE</text><text class="ink small" x="420" y="245">X-ray</text>
  <rect class="tag" x="164" y="482" width="308" height="42" rx="3"/><text class="ink small" x="318" y="508" text-anchor="middle">surface · contrast · candidate elements</text>

  <rect class="panelI" x="632" y="138" width="500" height="410" rx="3"/><text class="ink label" x="662" y="177">Focused ion beam</text><text class="ink small" x="662" y="204">sputter material at a selected site</text>
  <line class="beamI" x1="882" y1="226" x2="882" y2="318"/><text class="ink micro" x="904" y="246">ion</text>
  <path class="sample" d="M702 330H822L842 382H922L942 330H1062V456H702Z"/>
  <path class="cut" d="M822 330L842 382H922L942 330"/>
  <circle class="particle" cx="835" cy="301" r="6"/><circle class="particle" cx="858" cy="286" r="6"/><circle class="particle" cx="905" cy="288" r="6"/><circle class="particle" cx="931" cy="305" r="6"/>
  <path class="signal" d="M842 323L815 277"/><path class="signal" d="M921 323L951 277"/>
  <rect class="tag" x="728" y="482" width="308" height="42" rx="3"/><text class="ink small" x="882" y="508" text-anchor="middle">site-specific milling · cross-section</text>
  <line class="rule" x1="68" y1="594" x2="1132" y2="594"/><text class="ink micro" x="68" y="622">CONCEPTUAL COMPARISON · NOT TO SCALE · Source, species, beam energy, current, yield, and removal rate are unspecified.</text>
</svg>
